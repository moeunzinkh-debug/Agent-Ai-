# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2500m -Dfile.encoding=UTF-8 -Djava.awt.headless=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Keep parallelism modest: the Kotlin daemon, the Gradle daemon and the ninja/clang
# native build of llama.cpp all compete for memory on a 7 GB CI runner.
org.gradle.workers.max=2
# Run the Kotlin compiler and KSP in a dedicated Kotlin daemon (the default).
#
# Do NOT set this to "in-process". KSP2 boots an IntelliJ/Analysis-API environment,
# and inside a long-lived, reused Gradle daemon that global state can already be
# disposed, which fails intermittently with:
#   NullPointerException: ... because the return value of
#   "ksp.com.intellij.openapi.application.ApplicationManager.getApplication()" is null
# A separate daemon gets a clean environment per compilation.
kotlin.daemon.jvmargs=-Xmx2g -Djava.awt.headless=true

# KSP 2.2.10-2.0.2 registers its generated sources through kotlin.sourceSets, which AGP 9's
# built-in Kotlin rejects by default. The generated code is still compiled correctly, so
# downgrade this hard error back to the previous behaviour.
android.disallowKotlinSourceSets=false

# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true
